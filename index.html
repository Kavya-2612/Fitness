*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0f1e;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{opacity:.6}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.screen{padding:16px;padding-bottom:90px}
.screen-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.screen-title{font-size:22px;font-weight:700}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;font-weight:600;color:#94a3b8}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.row{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.summary-box{background:#0d2137;border:1px solid #1e3a5f;border-radius:10px;padding:10px 14px;font-size:13px;color:#94a3b8;margin-top:4px}
.tab-btn{padding:8px 14px;background:#1e293b;border:none;border-radius:20px;color:#64748b;cursor:pointer;font-size:13px;white-space:nowrap;transition:all .2s}
.tab-btn.active{background:#3b82f6;color:#fff;font-weight:600}
.input-field{width:100%;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 14px;color:#f1f5f9;font-size:14px;outline:none}
.input-field:focus{border-color:#3b82f6}
.label{display:block;font-size:12px;color:#64748b;margin-bottom:6px}
.grad-btn{width:100%;background:linear-gradient(90deg,#3b82f6,#a855f7);border:none;border-radius:12px;padding:14px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
.add-btn{background:linear-gradient(90deg,#3b82f6,#a855f7);border:none;border-radius:10px;padding:8px 16px;color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.add-small{background:#1e3a5f;border:1px solid #3b82f6;border-radius:8px;padding:5px 10px;color:#3b82f6;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.back-btn{background:#1e293b;border:none;border-radius:8px;padding:6px 14px;color:#94a3b8;cursor:pointer;font-size:13px}
.remove-btn{background:transparent;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:4px 8px}
.mini-input{flex:1;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#f1f5f9;font-size:13px;outline:none}
.mini-btn{background:#3b82f6;border:none;border-radius:8px;padding:8px 14px;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{background:#0f172a;border:1px solid #1e293b;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-btn{background:#1e293b;border:none;border-radius:8px;width:32px;height:32px;color:#94a3b8;cursor:pointer;font-size:16px}
.nav-header{background:#0f172a;border-bottom:1px solid #1e293b;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0f172a;border-top:1px solid #1e293b;display:flex;z-index:100}
.nav-btn{flex:1;background:transparent;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#334155;transition:color .2s}
.nav-btn.active{color:#3b82f6}
.nav-btn span:first-child{font-size:20px}
.nav-btn span:last-child{font-size:9px;font-weight:600}
.empty{text-align:center;color:#334155;padding:30px;font-size:14px}
.note{color:#64748b;font-size:13px;margin-bottom:10px}
.form-group{margin-bottom:14px}
.tabs-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tabs-row::-webkit-scrollbar{height:0}
.grad-text{background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hidden{display:none!important}
.tag{border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:1px}
.pill{background:#1e293b;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600}
select.input-field option{background:#0f172a}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.progress-bar{height:4px;background:#1e293b;border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:2px;transition:width .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen>*{animation:fadeIn .2s ease}
</style>
</head>

function calcBMI(weightKg, heightCm) {
  const v = weightKg / ((heightCm / 100) ** 2);
  return { value: +v.toFixed(1), label: v < 18.5 ? "Underweight" : v < 25 ? "Normal" : v < 30 ? "Overweight" : "Obese" };
}

function calcStreak(workouts) {
  let s = 0; const d = new Date();
  for (let i = 0; i < 30; i++) {
    const k = d.toISOString().split("T")[0];
    if (workouts.some(w => w.date === k)) s++;
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);
  }
  return s;
}

  const protein   = sumField(todayMeals, "protein");
  const carbs     = sumField(todayMeals, "carbs");
  const fat       = sumField(todayMeals, "fat");
  const latestWeight = APP.weights.length ? APP.weights[APP.weights.length-1].weight : APP.profile.weight;
  const { value:bmi, label:bmiLabel } = calcBMI(latestWeight, APP.profile.height);
  const streak = calcStreak(APP.workouts);
  const WEEK_LABELS = ["S","M","T","W","T","F","S"];
  const weeklyData = Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const k=d.toISOString().split("T")[0];
    return { day:WEEK_LABELS[d.getDay()], intake:sumField(APP.meals.filter(m=>m.date===k),"calories"), burned:sumField(APP.workouts.filter(w=>w.date===k),"calories") };
  });
  const weightChartData = APP.weights.slice(-14).map(w=>({date:w.date.slice(5),weight:w.weight}));
  return { todayWorkouts, todayMeals, todayWater, todaySteps, calIn, calBurned, protein, carbs, fat, latestWeight, bmi, bmiLabel, streak, weeklyData, weightChartData };
}

function generateBodyAnalysis({ bodyType, problemAreas }) {
  const db = BODY_ANALYSIS_DB[bodyType] || {};
  const out = { problems:[], exercises:[], diet:[], plan:[] };
  const planMap = {};
  problemAreas.forEach(area => {
    const d = db[area]; if (!d) return;
    out.problems.push(...d.problemAreas);
    out.exercises.push(...d.suggestedExercises);
    out.diet.push(...d.dietAdvice);
    d.workoutPlan.forEach(p => { if (!planMap[p.day]) planMap[p.day] = p; });
  });
  return {
    bodyType, problemAreas,
    problems:  [...new Set(out.problems)],
    exercises: [...new Set(out.exercises)].slice(0,8),
    diet:      [...new Set(out.diet)].slice(0,6),
    plan:      Object.values(planMap).sort((a,b)=>DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day)),
    score:     bodyType==="lean"?72:bodyType==="average"?54:38,
    analysisId:`FT-${Date.now().toString(36).toUpperCase()}`,
  };
}

// Rule engine for AI coach
const DEFICIT_PLAN=[{day:"Mon",focus:"Cardio + Core",exercises:"30min HIIT, Plank 3×60s, Mountain Climbers 3×20"},{day:"Tue",focus:"Upper Body",exercises:"Push-ups 4×15, DB Rows 3×12, Shoulder Press 3×10"},{day:"Wed",focus:"Cardio",exercises:"45min brisk walk or jog, Core circuit"},{day:"Thu",focus:"Lower Body",exercises:"Squats 4×12, Lunges 3×12, Glute Bridges 3×15"},{day:"Fri",focus:"HIIT",exercises:"20min HIIT circuit, Jump rope 3×3min"},{day:"Sat",focus:"Active Recovery",exercises:"30min walk, Stretching 15min"},{day:"Sun",focus:"Rest",exercises:"Full rest or light yoga"}];
const MUSCLE_PLAN=[{day:"Mon",focus:"Chest + Triceps",exercises:"Bench Press 4×8, Incline DB 3×10, Tricep Dips 3×12"},{day:"Tue",focus:"Back + Biceps",exercises:"Deadlifts 4×6, Pull-ups 3×8, DB Curls 4×10"},{day:"Wed",focus:"Rest / Cardio",exercises:"20min light cardio"},{day:"Thu",focus:"Shoulders + Traps",exercises:"OHP 4×8, Lateral Raises 3×15, Shrugs 3×12"},{day:"Fri",focus:"Legs",exercises:"Squats 5×5, Romanian DL 4×8, Calf Raises 5×15"},{day:"Sat",focus:"Arms",exercises:"Barbell Curl 4×10, Skull Crushers 3×12"},{day:"Sun",focus:"Rest",exercises:"Full rest"}];
const BEGINNER_PLAN=[{day:"Mon",focus:"Full Body A",exercises:"Squats 3×10, Push-ups 3×10, DB Rows 3×10"},{day:"Wed",focus:"Full Body B",exercises:"Deadlifts 3×8, OHP 3×10, Lat Pulldown 3×10"},{day:"Fri",focus:"Full Body C",exercises:"Lunges 3×10, Bench Press 3×10, Face Pulls 3×15"},{day:"Sat",focus:"Light Cardio",exercises:"30min walk or bike"},{day:"Sun",focus:"Rest",exercises:"Full rest"}];

function runRuleEngine({ profile, derived, workouts, meals, weights }) {
  const { calIn, calBurned, protein, todayWater, todayWorkouts, bmi, streak, latestWeight } = derived;
  const targetCal = profile.targetCalories || 2000;
  const proteinTarget = Math.round((latestWeight||75)*1.7);
  const goal = profile.goal;
  const issues = [], recommendations = [], nextSteps = [];
  const last7 = Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return d.toISOString().split("T")[0];});
  const weeklyWorkoutDays = new Set(workouts.filter(w=>last7.includes(w.date)).map(w=>w.date)).size;
  const calPct = calIn > 0 ? Math.round((calIn/targetCal)*100) : 0;
  const proteinPct = protein > 0 ? Math.round((protein/proteinTarget)*100) : 0;
  const weightTrendDir = weights.length < 2 ? "stable" : weights[weights.length-1].weight < weights[weights.length-2].weight ? "dropping" : weights[weights.length-1].weight > weights[weights.length-2].weight ? "rising" : "stable";

  let summary = "";
  let score = 50;

  if (weeklyWorkoutDays === 0) {
    issues.push({ severity:"critical", title:"No workouts logged this week", detail:"Consistency is the #1 driver of fitness results. Even 2–3 sessions per week creates meaningful adaptation.", why:"Zero activity means zero adaptation stimulus." });
    score -= 20;
  } else if (weeklyWorkoutDays < (profile.targetWorkouts||4)*0.5) {
    issues.push({ severity:"warning", title:`Only ${weeklyWorkoutDays} workout(s) this week`, detail:`Your target is ${profile.targetWorkouts} sessions. You're currently at ${weeklyWorkoutDays}.`, why:"Below 50% of target significantly slows progress." });
    score -= 10;
  } else { score += 15; }

  if (calIn === 0) {
    issues.push({ severity:"warning", title:"No meals logged today", detail:"Logging food is the most reliable predictor of hitting nutrition targets.", why:"Unlogged eating makes it impossible to track your deficit or surplus." });
  } else if (goal==="Weight Loss" && calPct > 115) {
    issues.push({ severity:"warning", title:`Calorie surplus detected (${calPct}% of target)`, detail:`You're consuming ${calIn-targetCal} kcal above your target. This will slow weight loss.`, why:"A 3500 kcal excess = 0.45kg gained." });
    score -= 10;
  } else if (goal==="Muscle Gain" && calPct < 95) {
    issues.push({ severity:"warning", title:"Calorie deficit during bulk", detail:"Muscle growth requires a slight caloric surplus. You're under target.", why:"Insufficient calories force the body to prioritise survival over muscle building." });
    score -= 8;
  } else { score += 10; }

  if (protein > 0 && proteinPct < 60) {
    issues.push({ severity:"critical", title:`Protein critically low (${proteinPct}% of target)`, detail:`Current: ${protein}g. Target: ${proteinTarget}g. Add high-protein foods to reach your goal.`, why:"Low protein causes muscle loss during deficit and blocks muscle synthesis during bulk." });
    score -= 15;
  } else if (protein > 0 && proteinPct >= 80) { score += 10; }

  if (todayWater < 4) {
    issues.push({ severity:"warning", title:`Low hydration (${todayWater} cups)`, detail:"Aim for 8+ cups daily. Dehydration reduces performance and increases hunger.", why:"Even 2% dehydration impairs cognitive and physical performance." });
    score -= 5;
  }

  if (streak >= 5) { score += 10; recommendations.push({ icon:"🏆", category:"Streak", title:`${streak}-day streak`, detail:"You're building a real habit. Consistency compounds.", }); }

  if (weeklyWorkoutDays >= 1) {
    const ex = EXERCISE_DB[goal] || EXERCISE_DB["Maintenance"];
    recommendations.push({ icon:"🏋️", category:"Workout", title:"Recommended exercises for your goal", detail:`Based on ${goal}, here are top exercises to include:`, plan: ex.map(e=>({day:e.type, focus:e.name, exercises:`${e.sets?e.sets+"×":""} ${e.reps?e.reps+" reps":""} ${e.duration?"| "+e.duration+"min":""} | ~${e.calories} cal`})) });
  }

  if (protein < proteinTarget) {
    const remaining = proteinTarget - protein;
    recommendations.push({ icon:"🍗", category:"Nutrition", title:`Need ${remaining}g more protein today`, detail:"Top sources to close the gap:", foods:["Chicken Breast 150g = 46g protein","Greek Yogurt 150g = 18g protein","Whey Protein Shake = 25g protein","Eggs (2) = 12g protein","Salmon 150g = 39g protein"] });
  }

  if (goal==="Weight Loss" && calPct > 100) nextSteps.push({ priority:1, action:"Reduce dinner portion — swap rice/pasta for extra vegetables to cut 200–300 kcal easily." });
  if (weeklyWorkoutDays < (profile.targetWorkouts||4)) nextSteps.push({ priority:1, action:`Log ${(profile.targetWorkouts||4)-weeklyWorkoutDays} more workout session(s) this week to hit your target.` });
  if (protein < proteinTarget * 0.8) nextSteps.push({ priority:1, action:`Add a high-protein meal or shake today. Need ${Math.round(proteinTarget - protein)}g more protein.` });
  nextSteps.push({ priority:2, action:"Log your weight daily (same time, same conditions) for accurate trend tracking." });
  nextSteps.push({ priority:2, action:"Prep your meals the night before — meal prepped athletes hit protein targets 3× more consistently." });

  score = Math.min(100, Math.max(0, score));
  const scoreLabel = score>=80?"Excellent":score>=60?"Good":score>=40?"Average":"Needs Work";
  summary = `Your overall fitness score is ${score}/100 (${scoreLabel}). ${weeklyWorkoutDays} workout day(s) logged this week. ${calIn>0?`Calorie intake at ${calPct}% of target.`:"No meals logged today."} ${protein>0?`Protein at ${proteinPct}% of daily goal.`:""}`;

  let weeklyPlan;
  if (goal==="Weight Loss") weeklyPlan = DEFICIT_PLAN;
  else if (goal==="Muscle Gain") weeklyPlan = MUSCLE_PLAN;
  else weeklyPlan = BEGINNER_PLAN;

  return { summary, score, scoreLabel, issues, recommendations, nextSteps, weeklyPlan, meta: { calPct, proteinPct, weeklyWorkoutDays, weightTrendDir, proteinTarget } };
}

function getTodayRec(d, proteinTarget, targetCal, hour) {
  const calPct = d.calIn > 0 ? (d.calIn/targetCal)*100 : 0;
  const proteinPct = d.protein > 0 ? (d.protein/proteinTarget)*100 : 0;
  const goal = APP.profile.goal;
  if (d.streak>=5 && d.todayWorkouts.length>0 && calPct>=85 && calPct<=115) return {icon:"🏆",category:"On Fire",title:"Perfect day in progress!",body:`${d.streak}-day streak, workout done, calories on target. You're executing at elite level. Focus on sleep tonight.`,cta:"View Progress",ctaScreen:"weight",urgency:"positive",tip:"Sleep before midnight increases anabolic hormone output by up to 30%."};
  if (d.streak===0 && d.todayWorkouts.length===0) return {icon:"💡",category:"Fresh Start",title:"Start your comeback today",body:"Every elite athlete has had a bad week. The difference is they always come back. One workout today rebuilds momentum.",cta:"Pick a Workout",ctaScreen:"workout",urgency:"motivational",tip:`Suggested: ${goal==="Weight Loss"?"20min brisk walk + 10min core":goal==="Muscle Gain"?"Upper body strength — 45min":"30min full-body circuit"}.`};
  if (d.todayWorkouts.length===0 && hour>=10) return {icon:"🏋️",category:"Workout",title:`Time to train — ${goal} focus`,body:`You haven't trained yet today. A quick session will have the highest impact.`,cta:"Log Workout",ctaScreen:"workout",urgency:"action",tip:goal==="Muscle Gain"?"Train within 90min of your next meal for maximum protein synthesis.":"Fasted or 2hrs post-meal cardio burns 20% more fat."};
  if (d.calIn===0 && hour>=9) return {icon:"🍳",category:"Nutrition",title:"Fuel your body — log breakfast",body:"Your metabolism is waiting. Eating within 1–2 hours of waking regulates cortisol and sets you up for better food choices all day.",cta:"Log Breakfast",ctaScreen:"nutrition",urgency:"action",tip:"Ideal breakfast: 30–40g protein + complex carbs + healthy fat."};
  if (d.protein < proteinTarget*0.4 && hour>=13) return {icon:"🍗",category:"Nutrition",title:`Need ${proteinTarget-d.protein}g more protein`,body:`You're at ${Math.round(proteinPct)}% of your protein target. Low protein causes muscle loss.`,cta:"Log Meal",ctaScreen:"nutrition",urgency:"action",tip:"Quick fix: Greek yogurt (18g) + chicken breast (46g) = 64g protein."};
  if (calPct>110 && goal==="Weight Loss") return {icon:"⚡",category:"Recovery",title:`${Math.round(d.calIn-targetCal)} kcal over — here's your fix`,body:"A 20–30 min brisk walk burns ~200 kcal. Keep dinner light.",cta:"Log Workout",ctaScreen:"workout",urgency:"warning",tip:"A 30min walk after dinner improves sleep quality and blood sugar control."};
  if (d.todayWater<3 && hour>=12) return {icon:"💧",category:"Hydration",title:"Drink up — performance is dropping",body:`At just ${d.todayWater} cup(s) you're already dehydrated. Even mild dehydration reduces performance by up to 20%.`,cta:"Track Water",ctaScreen:"dashboard",urgency:"warning",tip:"Set an alarm every 90 minutes. Cold water slightly boosts metabolism."};
  return {icon:"🎯",category:"Today's Focus",title:`Stay consistent with ${goal}`,body:"Consistency over intensity is the secret. Log your meals, hit your workout, drink your water.",cta:"Run AI Analysis",ctaScreen:"ai",urgency:"info",tip:"Users who log daily lose 2× more weight than those who log occasionally."};
}

function renderRing(pct, color, size=90) {
  const r = (size-10)/2, cx=size/2, circumference=2*Math.PI*r;
  const dash = (pct/100)*circumference;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"/>
  </svg>`;
}

function renderBarChart(data) {
  if (!data || !data.length) return '<div class="empty">No data yet</div>';
  const maxVal = Math.max(...data.map(d=>Math.max(d.intake||0, d.burned||0)), 1);
  return `<div style="display:flex;gap:4px;align-items:flex-end;height:80px">
    ${data.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%">
      <div style="flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="background:#3b82f666;border-radius:3px 3px 0 0;height:${Math.max(3,Math.round((d.intake/maxVal)*60))}px;width:100%"></div>
        <div style="background:#10b98166;border-radius:3px 3px 0 0;height:${Math.max(2,Math.round((d.burned/maxVal)*60))}px;width:100%"></div>
      </div>
      <span style="font-size:9px;color:#64748b">${d.day}</span>
    </div>`).join("")}
  </div>
  <div style="display:flex;gap:16px;margin-top:8px">
    <span style="font-size:11px;color:#3b82f6">■ Intake</span>
    <span style="font-size:11px;color:#10b981">■ Burned</span>
  </div>`;
}

function renderWeightChart(data) {
  if (!data || data.length < 2) return '<div class="empty" style="padding:20px">Log weight entries to see chart</div>';
  const vals = data.map(d=>d.weight);
  const min = Math.min(...vals)-1, max = Math.max(...vals)+1, range = max-min;
  const W=300, H=80, n=data.length;
  const pts = data.map((d,i)=>({x:i*(W/(n-1)), y:H-((d.weight-min)/range)*H}));
  const path = pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 300 80" style="width:100%;height:80px">
    <path d="${path}" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#a855f7"/>`).join("")}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:2px">
    <span>${data[0].date}</span><span>${data[data.length-1].date}</span>
  </div>`;
}

// ─── AI Coach Screen ───────────────────────────────────────────────────────────
function renderAI(derived) {
  const analysis = runRuleEngine({ profile:APP.profile, derived, workouts:APP.workouts, meals:APP.meals, weights:APP.weights });
  const scoreColor = analysis.score>=80?"#10b981":analysis.score>=60?"#3b82f6":analysis.score>=40?"#f59e0b":"#ef4444";
  const tab = UI.aiTab;

  const sevColors = {critical:{dot:"#ef4444",bg:"#1a0a0a",border:"#3f1111",label:"Critical"},warning:{dot:"#f59e0b",bg:"#1a1000",border:"#3f2800",label:"Warning"},info:{dot:"#3b82f6",bg:"#0a1628",border:"#1e3a5f",label:"Info"}};

  return `<div class="screen">
    <h2 class="screen-title" style="margin-bottom:4px">🤖 AI Fitness Coach</h2>
    <p class="note">Rule-based analysis — no API required</p>

    <div class="card" style="background:linear-gradient(135deg,#0f172a,#0a1628)">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
        <div style="position:relative;width:80px;height:80px;flex-shrink:0">
          ${renderRing(analysis.score, scoreColor, 80)}
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div style="font-size:20px;font-weight:800;color:${scoreColor}">${analysis.score}</div>
            <div style="font-size:9px;color:#64748b">/100</div>
          </div>
        </div>
        <div style="flex:1">
          <div style="font-size:18px;font-weight:700;margin-bottom:4px">${analysis.scoreLabel}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${analysis.issues.some(i=>i.severity==="critical")?`<span class="tag" style="background:#3f1111;color:#ef4444">⚠️ ${analysis.issues.filter(i=>i.severity==="critical").length} Critical</span>`:""}
            ${analysis.issues.some(i=>i.severity==="warning")?`<span class="tag" style="background:#3f2800;color:#fcd34d">${analysis.issues.filter(i=>i.severity==="warning").length} Warning</span>`:""}
            ${!analysis.issues.length?`<span class="tag" style="background:#14532d;color:#86efac">All Clear</span>`:""}
          </div>
        </div>
      </div>
      <div style="font-size:13px;color:#94a3b8;line-height:1.6;border-top:1px solid #1e293b;padding-top:12px">${analysis.summary}</div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${[["issues",`⚠️ Issues (${analysis.issues.length})`],["recommendations",`💡 Advice`],["nextSteps","✅ Steps"],["plan","📅 Plan"]].map(([id,lbl])=>`<button class="tab-btn${tab===id?" active":""}" onclick="UI.aiTab='${id}';render()">${lbl}</button>`).join("")}
    </div>

    ${tab==="issues" ? `
      ${analysis.issues.length===0?`<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px;margin-bottom:8px">✅</div><div style="font-size:16px;font-weight:700;color:#10b981">No Issues Detected</div><div style="font-size:13px;color:#64748b">Your habits are well-aligned with your ${APP.profile.goal} goal.</div></div>`:""}
      ${analysis.issues.map(issue=>{const s=sevColors[issue.severity]||sevColors.info;return`<div style="background:${s.bg};border:1px solid ${s.border};border-radius:14px;padding:16px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="width:10px;height:10px;border-radius:5px;background:${s.dot};flex-shrink:0;box-shadow:0 0 6px ${s.dot}"></div>
          <span style="flex:1;font-size:14px;font-weight:700">${e(issue.title)}</span>
          <span style="background:${s.dot}22;border:1px solid ${s.dot}55;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:${s.dot}">${s.label}</span>
        </div>
        <div style="font-size:13px;color:#94a3b8;line-height:1.6;padding-left:20px">${e(issue.detail)}</div>
      </div>`;}).join("")}
    ` : ""}

    ${tab==="recommendations" ? `
      ${analysis.recommendations.length===0?`<div class="card"><div class="empty">Log more data to unlock recommendations.</div></div>`:""}
      ${analysis.recommendations.map(rec=>`<div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:24px">${rec.icon}</span>
          <div style="flex:1"><div style="font-size:14px;font-weight:700">${e(rec.title)}</div><div style="font-size:11px;color:#3b82f6;font-weight:600">${rec.category}</div></div>
        </div>
        <div style="font-size:13px;color:#94a3b8;line-height:1.6;margin-bottom:${rec.foods||rec.plan?12:0}px">${e(rec.detail)}</div>
        ${rec.foods?rec.foods.map(f=>`<div style="display:flex;align-items:center;gap:8px;background:#0a0f1e;border-radius:8px;padding:8px 10px;margin-bottom:4px"><span style="color:#3b82f6;font-size:12px;font-weight:700">→</span><span style="font-size:12px;color:#94a3b8">${e(f)}</span></div>`).join(""):""}
        ${rec.plan?rec.plan.map(p=>`<div style="display:flex;gap:10px;margin-bottom:6px;background:#0a0f1e;border-radius:10px;padding:10px 12px;align-items:flex-start">
          <div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(90deg,#3b82f6,#a855f7);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${e(p.day)}</div>
          <div><div style="font-size:13px;font-weight:700">${e(p.focus)}</div><div style="font-size:11px;color:#64748b">${e(p.exercises)}</div></div>
        </div>`).join(""):""}
      </div>`).join("")}
    ` : ""}

    ${tab==="nextSteps" ? `
      ${analysis.nextSteps.length===0?`<div class="card"><div class="empty" style="color:#10b981">You're doing everything right! 🎉</div></div>`:""}
      ${analysis.nextSteps.map((step,i)=>`<div style="background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start">
        <div style="width:28px;height:28px;border-radius:14px;background:linear-gradient(90deg,#3b82f6,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0">${i+1}</div>
        <div style="flex:1">
          <div style="font-size:10px;color:#3b82f6;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">${step.priority===1?"Do Today":step.priority===2?"Do This Week":"When Possible"}</div>
          <div style="font-size:13px;color:#f1f5f9;line-height:1.6">${e(step.action)}</div>
        </div>
      </div>`).join("")}
    ` : ""}

    ${tab==="plan" ? `
      <p class="note">Recommended plan: <b style="color:#3b82f6">${APP.profile.goal}</b></p>
      ${analysis.weeklyPlan.map(p=>`<div style="display:flex;gap:12px;margin-bottom:10px;background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:12px 14px;align-items:flex-start">
        <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(90deg,#3b82f6,#a855f7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0">${p.day}</div>
        <div><div style="font-size:14px;font-weight:700;margin-bottom:2px">${p.focus}</div><div style="font-size:12px;color:#64748b;line-height:1.5">${e(p.exercises)}</div></div>
      </div>`).join("")}
      <div style="background:#0a1628;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-top:4px;font-size:11px;color:#64748b;line-height:1.6">
        💡 <b style="color:#94a3b8">Rest days:</b> Sleep 7–9 hours. Active recovery on off days accelerates muscle repair.
      </div>
    ` : ""}
  </div>`;
}

      </div>
    </div>`;
  }

  if (UI.nutritionDeleteId) {
    const m = APP.meals.find(x=>x.id===UI.nutritionDeleteId);

    html += renderDeleteModal("this weight entry",()=>`dispatch('removeWeight','${UI.weightDeleteDate}');UI.weightDeleteDate=null;render()`,"UI.weightDeleteDate=null;render()");

function renderDeleteModal(name, onConfirmFn, onCancelFn) {
  return `<div class="overlay">
    <div class="modal" style="padding:24px">
      <h3 style="margin:0 0 12px;font-size:18px;font-weight:700">Delete?</h3>
      <p style="color:#94a3b8;font-size:14px;margin-bottom:20px">Remove <b>${e(name)}</b>? This cannot be undone.</p>
      <div style="display:flex;gap:8px">
        <button onclick="${onCancelFn}" style="flex:1;background:#1e293b;border:none;border-radius:10px;padding:12px;color:#94a3b8;cursor:pointer;font-size:14px">Cancel</button>
        <button onclick="${onConfirmFn}" style="flex:1;background:#3f1111;border:1px solid #ef4444;border-radius:10px;padding:12px;color:#ef4444;cursor:pointer;font-size:14px;font-weight:700">Delete</button>
      </div>
    </div>
  </div>`;
}

// ─── Escape helper ────────────────────────────────────────────────────────────
function e(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── Modal helpers ─────────────────────────────────────────────────────────────
function openWorkoutModal() { UI.workoutEditId=null; UI.workoutForm={name:"",type:"",sets:3,reps:10,duration:0,calories:50}; UI.workoutModal=true; render(); }
function openWorkoutEditModal(w) { UI.workoutEditId=w.id; UI.workoutForm={name:w.name,type:w.type,sets:w.sets||3,reps:w.reps||10,duration:w.duration||0,calories:w.calories||50}; UI.workoutModal=true; render(); }
function submitWorkout() {
  const f=UI.workoutForm; if(!f.name) return;
  const data={...f,sets:+f.sets,reps:+f.reps,duration:+f.duration,calories:+f.calories};
  if(UI.workoutEditId) dispatch('editWorkout',UI.workoutEditId,data);
  else dispatch('addWorkout',data);
  UI.workoutModal=false; UI.workoutTab="today"; render();
}
function openNutritionModal() { UI.nutritionEditId=null; UI.nutritionForm={name:"",meal:UI.nutritionTab==="favorites"?"Breakfast":UI.nutritionTab,calories:0,protein:0,carbs:0,fat:0}; UI.nutritionModal=true; render(); }
function openNutritionEditModal(m) { UI.nutritionEditId=m.id; UI.nutritionForm={name:m.name,meal:m.meal,calories:m.calories,protein:m.protein,carbs:m.carbs,fat:m.fat}; UI.nutritionModal=true; render(); }
function submitNutrition() {
  const f=UI.nutritionForm; if(!f.name) return;
  const data={...f,calories:+f.calories,protein:+f.protein,carbs:+f.carbs,fat:+f.fat};
  if(UI.nutritionEditId) dispatch('editMeal',UI.nutritionEditId,data);
  else dispatch('addMeal',data);
  UI.nutritionModal=false; render();
}
function openWeightModal() { UI.weightEditDate=null; UI.weightInput=""; UI.weightModal=true; render(); }
function openWeightEditModal(date,weight) { UI.weightEditDate=date; UI.weightInput=String(weight); UI.weightModal=true; render(); }
function submitWeight() {
  if(!UI.weightInput) return;
  if(UI.weightEditDate) dispatch('editWeight',UI.weightEditDate,UI.weightInput);
  else dispatch('addWeight',UI.weightInput);
  UI.weightModal=false; render();
}
function openReminderModal() { UI.reminderEditId=null; UI.reminderForm={label:"",time:"08:00",icon:"🔔",days:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]}; UI.reminderModal=true; render(); }
function submitReminder() {
  const f=UI.reminderForm; if(!f.label) return;
  if(UI.reminderEditId) dispatch('updateReminder',UI.reminderEditId,f);
  else dispatch('addReminder',f);
  UI.reminderModal=false; render();
}
function toggleReminderDay(d) {
  const days=UI.reminderForm.days;
  UI.reminderForm.days = days.includes(d) ? days.filter(x=>x!==d) : [...days,d];
  render();
}
function openProfileEdit() { UI.profileForm={...APP.profile}; render(); }
function saveProfile() {
  if(!UI.profileForm) return;
  const p=UI.profileForm;
  dispatch('updateProfile',{...p,age:+p.age,weight:+p.weight,height:+p.height,targetWeight:+p.targetWeight,targetCalories:+p.targetCalories,targetWorkouts:+p.targetWorkouts});
  UI.profileForm=null; render();
}

function toggleBodyArea(id) { UI.bodyAreas=UI.bodyAreas.includes(id)?UI.bodyAreas.filter(x=>x!==id):[...UI.bodyAreas,id]; render(); }
function runBodyAnalysis() {
  if(!UI.bodyType||!UI.bodyAreas.length) return;
  UI.bodyResult=generateBodyAnalysis({bodyType:UI.bodyType,problemAreas:UI.bodyAreas});
  UI.bodyStep=2; render();
}

function addStepsFromInput() {
  const v=document.getElementById("steps-in")?.value; if(!v) return;
  dispatch('addSteps',v); render();
}

function closeIfBg(event, key) {
  if(event.target===event.currentTarget) { UI[key]=false; render(); }
}

function renderAuth_update() {
  document.getElementById("root").innerHTML=renderAuth(); bindAuth();
}

function bindAuth() {
  // Auth handled inline via oninput
}

function doLogin() {
  const name=document.getElementById("auth-name")?.value||UI.authForm.name||"Athlete";
  const email=document.getElementById("auth-email")?.value||UI.authForm.email||"";
  dispatch('login',name,email);
}

function bindAll(derived) { /* event delegation already used inline */ }

// _nav action
actions['_nav'] = (screen) => { APP.screen = screen; };

// ─── Bootstrap ────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
